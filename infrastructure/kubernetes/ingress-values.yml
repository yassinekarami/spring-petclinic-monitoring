controller:
  service:
    type: LoadBlancer
    loadBalancerIP: "${CLUSTER_LOADBALANCER_ID_ADDRESS}"
    annotations:
      service.beta.kubernetes.io/scw-loadblander-proxy-protocaol-v2: "true"
      service.beta.kubernetes.io/scw-loadbalancer-use-hostname: "true
  config:
    use-proxy-protocol: "true"
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
