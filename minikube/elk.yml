appVersion: apps/v1
kind: Deployment
metadata:
  name: elk
  labels:
    app: elk


spec:
  replicas: 1
  selector:
    matchLabels:
      app: elk
  template:
    metadata:
      labales:
        app: elk
    spec:
      containers:
        - name: elk
          image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.4.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
