apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-performance
spec:
  suspend: true
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: k6
              image: grafana/k6
              imagePullPolicy: IfNotPresent
              command:
                - k6
                - run
                -  -o
                - experimental-prometheus-rw
                - /etc/config/performance.js
              env:
                - name: K6_PROMETHEUS_RW_SERVER_URL
                  value: 'http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write'
                - name: K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM
                  value: "true"
              envFrom:
                - configMapRef:
                    name: script-config-values
              volumeMounts:
                - name: script-volume
                  mountPath: /etc/config
                  readOnly: true
                - name: script-volume-values
                  mountPath: /etc/config-values
                  readOnly: true
          restartPolicy: OnFailure

          volumes:
            - name: script-volume
              configMap:
                name: script-config
            - name: script-volume-values
              configMap:
                name: script-config-values


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: script-config
data:
  performance.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';
    export const options = {
      vus: Number(__ENV.VUS || 10),
      duration: __ENV.DURATION || '30s',
    };
    export default function () {
    http.get('http://petclinic-service.default.svc.cluster.local:8080/vets');
    sleep(1);
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: script-config-values
data:
  VUS: "10"
  DURATION: "30s"
