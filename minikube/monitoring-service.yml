apiVersion: v1
kind: Service
metadata:
  name: prometheus-server-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: prometheus-kube-prometheus-prometheus
    app.kubernetes.io/name: prometheus
  ports:
    - port: 80
      targetPort: 9090
      nodePort: 31731



---

apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: grafana
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30632

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus-kube-state-metrics-service
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: kube-state-metrics
  type: NodePort
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30581


