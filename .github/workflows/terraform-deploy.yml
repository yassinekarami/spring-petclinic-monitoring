name: Terraform deployment

on:
  workflow_dispatch:

env:
  TF_VAR_API_TOKEN: "${{ secrets.TF_API_KEY }}"
  TF_VAR_access_key: "${{ secrets.ACCESS_KEY }}"
  TF_VAR_organization_id: "${{ secrets.ORGANIZATION_ID }}"
  TF_VAR_project_id: "${{ secrets.PROJECT_ID }}"
  TF_VAR_secret_key: "${{ secrets.SECRET_KEY }}"

jobs:

  variable:
    name: Check variables
    runs-on: ubuntu-latest
    environment: env

    steps:
      - name: Check environment variables
        run: |
          [ -n "$TF_VAR_API_TOKEN" ] && echo "TF_API_TOKEN is set" || echo "TF_API_TOKEN is NOT set"
          [ -n "$TF_VAR_access_key" ] && echo "ACCESS_KEY is set" || echo "ACCESS_KEY is NOT set"
          [ -n "$TF_VAR_organization_id" ] && echo "ORGANIZATION_ID is set" || echo "ORGANIZATION_ID is NOT set"
          [ -n "$TF_VAR_project_id" ] && echo "PROJECT_ID is set" || echo "PROJECT_ID is NOT set"
          [ -n "$TF_VAR_secret_key" ] && echo "SECRET_KEY is set" || echo "SECRET_KEY is NOT set"

  terraform:
    name: Terraform
    needs: [variable]
    runs-on: ubuntu-latest
    environment: env

    outputs:
      cluster_id: ${{ steps.terraform-output.outputs.cluster_id }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SECRET_KEY }}"

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan

      - name: Terraform apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve

      - name: Get cluster ID
        id: terraform-output
        working-directory: infrastructure/terraform
        run: |
          cluster_id=$(terraform output -raw cluster_id)

          if [ -z "$cluster_id" ]; then
            echo "ERROR: cluster_id is empty"
            exit 1
          fi
          echo "cluster_id=$cluster_id" >> "$GITHUB_OUTPUT"

  kubernetes_deploy:
    name: Kubernetes
    needs: [terraform]
    runs-on: ubuntu-latest
    environment: env

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.ACCESS_KEY }}
          secret-key: ${{ secrets.SECRET_KEY }}
          default-project-id: ${{ secrets.PROJECT_ID }}

      - name: Configure kubeconfig
        env:
          CLUSTER_ID: ${{ needs.terraform.outputs.cluster_id }}
          SCW_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          if [ -z "$CLUSTER_ID" ]; then
            echo "ERROR: cluster_id is empty"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          scw k8s cluster list
          CLUSTER_UUID="${CLUSTER_ID#*/}"
          scw k8s cluster get "$CLUSTER_UUID"
          scw k8s kubeconfig get "$CLUSTER_UUID" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Check Kubernetes cluster
        run: |
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy
        working-directory: infrastructure/kubernetes
        run: |
          kubectl apply -f namespace.yml
          kubectl apply -f petclinic.yml
          kubectl apply -f k6.yml

      - name: Check deployment
        run: |
          kubectl get pods
          kubectl get services
